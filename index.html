<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор QR и штрихкодов</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 10px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-generate {
      background: #28a745;
      color: white;
    }
    .btn-generate:hover {
      background: #218838;
    }

    .mode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .mode-buttons button {
      background: #e9ecef;
      color: #333;
      flex: 1 1 auto;
      min-width: 130px;
    }
    .mode-buttons button.active {
      background: #007bff;
      color: white;
    }

    #result {
      text-align: center;
      margin-top: 20px;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
      border-radius: 4px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
    }

    .upload-section {
      display: none;
      margin-bottom: 18px;
      text-align: left;
    }
    
    .upload-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-label {
      display: inline-block;
      padding: 10px 16px;
      background: #e9ecef;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    .upload-input {
      display: none;
    }

    .upload-status {
      margin-left: 12px;
      padding: 6px 12px;
      background: #d4edda;
      color: #155724;
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: nowrap;
      display: none;
    }

    .actions {
      margin-top: 15px;
      text-align: center;
    }
    .btn-download {
      background: #6c757d;
      color: white;
    }
    .btn-download:hover {
      background: #545c64;
    }

    @media (max-width: 480px) {
      .mode-buttons button {
        min-width: 100%;
      }
      .upload-wrapper {
        flex-direction: column;
        align-items: stretch;
      }
      .upload-status {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор QR и штрихкодов</h1>

    <div class="controls">
      <input type="text" id="inputText" placeholder="Введите текст или ссылку" value="https://example.com" />
      <button class="btn-generate" onclick="generate()">Сгенерировать</button>
    </div>

    <div class="mode-buttons">
      <button id="btnMode1" class="active" onclick="setMode(1)">Обычный QR</button>
      <button id="btnMode2" onclick="setMode(2)">Штрихкод</button>
      <button id="btnMode3" onclick="setMode(3)">QR с картинкой</button>
    </div>

    <div id="uploadSection" class="upload-section">
      <div class="upload-wrapper">
        <label class="upload-label">
          Загрузить картинку для центра QR
          <input type="file" id="imageInput" class="upload-input" accept="image/*" />
        </label>
        <span id="uploadStatus" class="upload-status"></span>
      </div>
    </div>

    <div id="result"></div>

    <div class="actions">
      <button class="btn-download" onclick="downloadResult()">Скачать результат (PNG)</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    let currentMode = 1;
    let userImage = null;
    let lastResultCanvas = null;

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
      if (mode === 1) document.getElementById('btnMode1').classList.add('active');
      if (mode === 2) document.getElementById('btnMode2').classList.add('active');
      if (mode === 3) document.getElementById('btnMode3').classList.add('active');

      const uploadSection = document.getElementById('uploadSection');
      const status = document.getElementById('uploadStatus');
      
      if (mode === 3) {
        uploadSection.style.display = 'block';
      } else {
        uploadSection.style.display = 'none';
        userImage = null;
        status.style.display = 'none';
        status.textContent = '';
      }
      document.getElementById('result').innerHTML = '';
      lastResultCanvas = null;
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        userImage = event.target.result;
        const status = document.getElementById('uploadStatus');
        status.textContent = 'Загружено: ' + file.name;
        status.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function generate() {
      const text = document.getElementById('inputText').value.trim();
      if (!text) {
        alert('Введите текст или ссылку');
        return;
      }

      document.getElementById('result').innerHTML = '';
      lastResultCanvas = null;

      if (currentMode === 1) {
        const container = document.createElement('div');
        container.id = 'qr-container-1';
        document.getElementById('result').appendChild(container);
        new QRCode(container, {
          text: text,
          width: 256,
          height: 256
        });

        setTimeout(() => {
          const img = container.querySelector('img');
          if (img) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width || 256;
            canvas.height = img.height || 256;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            lastResultCanvas = canvas;
          }
        }, 150);
      } 
      else if (currentMode === 2) {
        const canvas = document.createElement('canvas');
        canvas.id = 'barcodeCanvas';
        canvas.width = 300;
        canvas.height = 120;
        document.getElementById('result').appendChild(canvas);

        JsBarcode(canvas, text, {
          format: "CODE128",
          displayValue: true,
          fontSize: 14,
          textAlign: "center",
          fontOptions: "bold"
        });

        lastResultCanvas = canvas;
      } 
      else if (currentMode === 3) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        const qrContainer = document.createElement('div');
        qrContainer.style.position = 'absolute';
        qrContainer.style.left = '-9999px';
        document.body.appendChild(qrContainer);
        
        new QRCode(qrContainer, {
          text: text,
          width: 256,
          height: 256
        });

        setTimeout(() => {
          const qrImg = qrContainer.querySelector('img');
          if (!qrImg) {
            alert('Ошибка генерации QR');
            qrContainer.remove();
            return;
          }
          ctx.drawImage(qrImg, 0, 0, 256, 256);

          const iconSize = 80;
          const x = (256 - iconSize) / 2;
          const y = (256 - iconSize) / 2;

          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.onload = () => {
            ctx.drawImage(img, x, y, iconSize, iconSize);
            const resultImg = document.createElement('img');
            resultImg.src = canvas.toDataURL('image/png');
            document.getElementById('result').appendChild(resultImg);
            lastResultCanvas = canvas;
            qrContainer.remove();
          };
          img.onerror = () => {
            const resultImg = document.createElement('img');
            resultImg.src = canvas.toDataURL('image/png');
            document.getElementById('result').appendChild(resultImg);
            lastResultCanvas = canvas;
            qrContainer.remove();
          };

          if (userImage) {
            img.src = userImage;
          } else {
            img.src = 'https://via.placeholder.com/80';
          }
        }, 150);
      }
    }

    function downloadResult() {
      if (!lastResultCanvas) {
        alert('Сначала сгенерируйте код');
        return;
      }
      const link = document.createElement('a');
      link.download = 'code.png';
      link.href = lastResultCanvas.toDataURL('image/png');
      link.click();
    }

    setMode(1);
  </script>
</body>
</html>
