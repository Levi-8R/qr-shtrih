<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор QR и штрихкодов</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2b2b2b;
      --text: #e0e0e0;
      --accent: #4caf50;
      --accent-hover: #388e3c;
      --border: #333;
      --input-bg: #373737;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--panel);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-generate {
      background: var(--accent);
      color: white;
    }
    .btn-generate:hover, .btn-generate.active {
      background: var(--accent-hover);
    }

    .mode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-buttons button {
      background: #3c3c3c;
      color: var(--text);
      flex: 1 1 auto;
      min-width: 130px;
    }
    .mode-buttons button.active {
      background: #555;
      color: white;
    }

    #result {
      text-align: center;
      margin-top: 20px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
      image-rendering: pixelated; /* чтобы QR был чётким */
    }

    .upload-section {
      display: none;
      margin-bottom: 18px;
      text-align: left;
    }
    .upload-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .upload-label {
      display: inline-block;
      padding: 10px 16px;
      background: #3c3c3c;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    .upload-input {
      display: none;
    }
    .upload-status {
      margin-left: 12px;
      padding: 6px 12px;
      background: #2a5f30;
      color: #a5d6a7;
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: nowrap;
      display: none;
    }

    .actions {
      margin-top: 15px;
      text-align: center;
    }
    .btn-download {
      background: #555;
      color: white;
    }
    .btn-download:hover {
      background: #777;
    }

    @media (max-width: 480px) {
      .mode-buttons button { min-width: 100%; }
      .upload-wrapper { flex-direction: column; align-items: stretch; }
      .upload-status { margin-left: 0; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор QR и штрихкодов</h1>

    <div class="controls">
      <input type="text" id="inputText" placeholder="Введите текст или ссылку" value="https://example.com" />
      <button class="btn-generate" id="genBtn" onclick="generate()">Сгенерировать</button>
    </div>

    <div class="mode-buttons">
      <button id="btnMode1" class="active" onclick="setMode(1)">Обычный QR</button>
      <button id="btnMode2" onclick="setMode(2)">Штрихкод</button>
      <button id="btnMode3" onclick="setMode(3)">QR с картинкой</button>
    </div>

    <div id="uploadSection" class="upload-section">
      <div class="upload-wrapper">
        <label class="upload-label">
          Загрузить картинку для центра QR
          <input type="file" id="imageInput" class="upload-input" accept="image/*" />
        </label>
        <span id="uploadStatus" class="upload-status"></span>
      </div>
    </div>

    <div id="result"></div>

    <div class="actions">
      <button class="btn-download" onclick="downloadResult()">Скачать результат (PNG)</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    let currentMode = 1;
    let userImage = null;
    let lastCanvas = null; // канвас с готовым QR+логотип для скачивания и показа

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
      if (mode === 1) document.getElementById('btnMode1').classList.add('active');
      if (mode === 2) document.getElementById('btnMode2').classList.add('active');
      if (mode === 3) document.getElementById('btnMode3').classList.add('active');

      const uploadSection = document.getElementById('uploadSection');
      const status = document.getElementById('uploadStatus');
      
      if (mode === 3) {
        uploadSection.style.display = 'block';
      } else {
        uploadSection.style.display = 'none';
        userImage = null;
        status.style.display = 'none';
        status.textContent = '';
      }
      document.getElementById('result').innerHTML = '';
      lastCanvas = null;
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        userImage = event.target.result;
        const status = document.getElementById('uploadStatus');
        status.textContent = 'Загружено: ' + file.name;
        status.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function generate() {
      const btn = document.getElementById('genBtn');
      btn.classList.add('active');
      
      const text = document.getElementById('inputText').value.trim();
      if (!text) {
        alert('Введите текст или ссылку');
        btn.classList.remove('active');
        return;
      }

      document.getElementById('result').innerHTML = '';
      lastCanvas = null;

      try {
        if (currentMode === 1) {
          // Обычный QR: сразу рисуем на канвасе через QRCodeJS
          drawQrOnCanvas(text, false);
        } 
        else if (currentMode === 2) {
          // Штрихкод: рисуем на канвасе
          drawBarcodeOnCanvas(text);
        } 
        else if (currentMode === 3) {
          if (!userImage) {
            alert('Загрузите картинку для центра QR');
            btn.classList.remove('active');
            return;
          }
          drawQrOnCanvas(text, true);
        }
      } catch (e) {
        console.error(e);
        btn.classList.remove('active');
        alert('Ошибка при генерации кода');
      }
    }

    // Рисуем QR на канвасе (свой, не из библиотеки в DOM)
    function drawQrOnCanvas(text, withLogo) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      // Генерируем QR во временный контейнер, чтобы получить dataURL
      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'absolute';
      tempContainer.style.left = '-9999px';
      document.body.appendChild(tempContainer);

      const qr = new QRCode(tempContainer, {
        text: text,
        width: 256,
        height: 256
      });

      // Ждём появления img
      const check = setInterval(() => {
        const img = tempContainer.querySelector('img');
        if (img && img.naturalWidth) {
          clearInterval(check);
          document.body.removeChild(tempContainer);
          ctx.drawImage(img, 0, 0);

          if (withLogo && userImage) {
            const logo = new Image();
            logo.onload = () => {
              const size = 80;
              const x = (c.width - size) / 2;
              const y = (c.height - size) / 2;
              ctx.drawImage(logo, x, y, size, size);
              finishRender(c);
            };
            logo.onerror = () => finishRender(c);
            logo.src = userImage;
          } else {
            finishRender(c);
          }
        }
      }, 50);
    }

    function drawBarcodeOnCanvas(text) {
      const c = document.createElement('canvas');
      c.width = 300;
      c.height = 120;
      const ctx = c.getContext('2d');
      JsBarcode(c, text, {
        format: "CODE128",
        displayValue: true,
        fontSize: 14,
        textAlign: "center",
        fontOptions: "bold"
      });
      finishRender(c);
    }

    function finishRender(canvas) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';
      resultDiv.appendChild(canvas);
      lastCanvas = canvas;
      document.getElementById('genBtn').classList.remove('active');
    }

    function downloadResult() {
      if (!lastCanvas) {
        alert('Сначала сгенерируйте код');
        return;
      }
      const link = document.createElement('a');
      link.download = 'code.png';
      link.href = lastCanvas.toDataURL('image/png');
      link.click();
    }

    setMode(1);
  </script>
</body>
</html>
