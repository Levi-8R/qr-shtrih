<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор кодов</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent: #bb86fc;
            --accent-hover: #9d5bcf;
            --border: #333333;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .tab-btn {
            padding: 0.6rem 1rem;
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 0.6rem;
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
        }

        button.action {
            margin-top: 1.2rem;
            padding: 0.8rem 1.4rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        button.action:hover {
            background: var(--accent-hover);
        }

        #preview-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        img.result-image {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: none; /* скрываем, пока нет результата */
        }

        .status-msg {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: left;
        }

        /* Статус загрузки фото */
        #image-status {
            margin-top: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .controls { flex-direction: column; align-items: stretch; }
            .tab-btn, .tab-btn.active { width: 100%; text-align: center; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор кодов</h1>

        <!-- Переключатель режимов -->
        <div class="controls">
            <button class="tab-btn active" onclick="setMode('qr')">QR-код</button>
            <button class="tab-btn" onclick="setMode('barcode')">Штрихкод (Code128)</button>
            <button class="tab-btn" onclick="setMode('qr-image')">QR с картинкой</button>
        </div>

        <div class="panel">
            <!-- QR-код -->
            <div id="mode-qr" class="mode-content">
                <label for="qr-text">Текст для QR-кода:</label>
                <input type="text" id="qr-text" placeholder="Введите текст или URL">
                <button class="action" onclick="generateQR()">Сгенерировать QR-код</button>
                <div id="preview-container">
                    <img id="qr-image" class="result-image" alt="QR-код">
                    <button class="action" style="margin-top:0.8rem;" onclick="downloadImage('qr-image')">Скачать PNG</button>
                </div>
            </div>

            <!-- Штрихкод -->
            <div id="mode-barcode" class="mode-content" style="display:none;">
                <label for="barcode-text">Текст для штрихкода:</label>
                <input type="text" id="barcode-text" placeholder="Только цифры/буквы без спецсимволов">
                <button class="action" onclick="generateBarcode()">Сгенерировать штрихкод</button>
                <div id="preview-container-barcode">
                    <img id="barcode-image" class="result-image" alt="Штрихкод">
                    <button class="action" style="margin-top:0.8rem;" onclick="downloadImage('barcode-image')">Скачать PNG</button>
                </div>
            </div>

            <!-- QR с картинкой -->
            <div id="mode-qr-image" class="mode-content" style="display:none;">
                <label for="qr-with-img-text">Текст для QR:</label>
                <input type="text" id="qr-with-img-text" placeholder="Текст или URL">

                <label for="center-image">Картинка в центр QR:</label>
                <input type="file" id="center-image" accept="image/*">
                <div id="image-status"></div>

                <button class="action" onclick="generateQRWithImage()">Сгенерировать QR с картинкой</button>

                <div id="preview-container-qr-image">
                    <img id="qr-with-image" class="result-image" alt="QR с картинкой">
                    <button class="action" style="margin-top:0.8rem;" onclick="downloadImage('qr-with-image')">Скачать PNG</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script>
        let loadedImage = null;

        // Переключение режимов
        function setMode(mode) {
            document.querySelectorAll('.mode-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (mode === 'qr') {
                document.getElementById('mode-qr').style.display = 'block';
                document.querySelector('.controls .tab-btn:nth-child(1)').classList.add('active');
            } else if (mode === 'barcode') {
                document.getElementById('mode-barcode').style.display = 'block';
                document.querySelector('.controls .tab-btn:nth-child(2)').classList.add('active');
            } else if (mode === 'qr-image') {
                document.getElementById('mode-qr-image').style.display = 'block';
                document.querySelector('.controls .tab-btn:nth-child(3)').classList.add('active');
            }

            // Скрываем старые картинки при переключении
            document.querySelectorAll('.result-image').forEach(img => {
                img.style.display = 'none';
                img.src = '';
            });
        }

        // Обработка загрузки картинки
        document.getElementById('center-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const status = document.getElementById('image-status');
            if (!file) {
                loadedImage = null;
                status.textContent = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                loadedImage = event.target.result; // base64
                status.textContent = 'Загружено: ' + file.name;
            };
            reader.readAsDataURL(file);
        });

        function showImage(imgId, dataUrl) {
            const img = document.getElementById(imgId);
            img.src = dataUrl;
            img.style.display = 'block';
        }

        function downloadImage(imgId) {
            const img = document.getElementById(imgId);
            if (!img.src) return;
            const link = document.createElement('a');
            link.download = 'code.png';
            link.href = img.src;
            link.click();
        }

        function generateQR() {
            const text = document.getElementById('qr-text').value.trim();
            if (!text) {
                alert('Введите текст для QR-кода');
                return;
            }
            const container = document.createElement('div');
            const qr = new QRCode(container, {
                text: text,
                width: 256,
                height: 256
            });
            const canvas = qr.canvas;
            showImage('qr-image', canvas.toDataURL('image/png'));
        }

        function generateBarcode() {
            const text = document.getElementById('barcode-text').value.trim();
            if (!text) {
                alert('Введите текст для штрихкода');
                return;
            }
            const target = document.getElementById('barcode-image');
            // Очищаем старые элементы, чтобы JsBarcode мог создать свой canvas
            target.parentElement.querySelectorAll('canvas').forEach(c => c.remove());
            JsBarcode(target, text, {
                format: "CODE128",
                displayValue: true,
                fontSize: 14,
                width: 2,
                height: 50
            });

            // После отрисовки JsBarcode рисует в canvas рядом с img — берём его
            const barcodeCanvas = target.parentElement.querySelector('canvas');
            if (barcodeCanvas) {
                showImage('barcode-image', barcodeCanvas.toDataURL('image/png'));
            }
        }

        async function generateQRWithImage() {
            const text = document.getElementById('qr-with-img-text').value.trim();
            if (!text) {
                alert('Введите текст для QR-кода');
                return;
            }
            if (!loadedImage) {
                alert('Загрузите картинку для центра QR-кода');
                return;
            }

            const container = document.createElement('div');
            const qr = new QRCode(container, {
                text: text,
                width: 256,
                height: 256
            });
            const canvas = qr.canvas;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.src = loadedImage;
            img.onload = () => {
                const size = 80; // размер картинки в центре
                const offset = (256 - size) / 2;
                ctx.drawImage(img, offset, offset, size, size);

                showImage('qr-with-image', canvas.toDataURL('image/png'));
            };
        }
    </script>
</body>
</html>
