<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор кодов</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent: #bb86fc;
            --accent-hover: #9d5bcf;
            --border: #333333;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: 500;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 0.6rem;
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
            margin-top: 0.4rem;
        }

        button {
            margin-top: 1rem;
            padding: 0.7rem 1.2rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: var(--accent-hover);
        }

        #preview-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        #qr-image,
        #barcode-image {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: none; /* скрываем, пока нет результата */
        }

        .status-msg {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: left;
        }

        /* Статус загрузки фото */
        #image-status {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .panel { padding: 1rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор QR и штрихкодов</h1>

        <!-- QR-код -->
        <div class="panel">
            <h2>QR-код</h2>
            <label for="qr-text">Текст для QR-кода:</label>
            <input type="text" id="qr-text" placeholder="Введите текст или URL">
            <button onclick="generateQR()">Сгенерировать QR-код</button>
            <div id="preview-container">
                <img id="qr-image" alt="QR-код">
                <button onclick="downloadImage('qr-image')" style="margin-top:0.8rem;">Скачать PNG</button>
            </div>
        </div>

        <!-- Штрихкод -->
        <div class="panel">
            <h2>Штрихкод (Code128)</h2>
            <label for="barcode-text">Текст для штрихкода:</label>
            <input type="text" id="barcode-text" placeholder="Только цифры/буквы без спецсимволов">
            <button onclick="generateBarcode()">Сгенерировать штрихкод</button>
            <div id="preview-container">
                <img id="barcode-image" alt="Штрихкод">
                <button onclick="downloadImage('barcode-image')" style="margin-top:0.8rem;">Скачать PNG</button>
            </div>
        </div>

        <!-- QR с картинкой -->
        <div class="panel">
            <h2>QR-код с картинкой в центре</h2>
            <label for="qr-with-img-text">Текст для QR:</label>
            <input type="text" id="qr-with-img-text" placeholder="Текст или URL">

            <label for="center-image">Картинка в центр QR:</label>
            <input type="file" id="center-image" accept="image/*">
            <div id="image-status"></div>

            <button onclick="generateQRWithImage()">Сгенерировать QR с картинкой</button>

            <div id="preview-container">
                <img id="qr-with-image" alt="QR с картинкой">
                <button onclick="downloadImage('qr-with-image')" style="margin-top:0.8rem;">Скачать PNG</button>
            </div>
        </div>
    </div>

    <!-- Библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script>
        let loadedImage = null;

        // Обработка загрузки картинки
        document.getElementById('center-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const status = document.getElementById('image-status');
            if (!file) {
                loadedImage = null;
                status.textContent = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                loadedImage = event.target.result; // base64
                status.textContent = 'Загружено: ' + file.name;
            };
            reader.readAsDataURL(file);
        });

        function showImage(imgId, dataUrl) {
            const img = document.getElementById(imgId);
            img.src = dataUrl;
            img.style.display = 'block';
        }

        function downloadImage(imgId) {
            const img = document.getElementById(imgId);
            if (!img.src) return;
            const link = document.createElement('a');
            link.download = 'code.png';
            link.href = img.src;
            link.click();
        }

        function generateQR() {
            const text = document.getElementById('qr-text').value.trim();
            if (!text) {
                alert('Введите текст для QR-кода');
                return;
            }
            const qr = new QRCode(document.getElementById('qr-image'), {
                text: text,
                width: 256,
                height: 256
            });
            // QRCode.js рисует напрямую в DOM, поэтому берём canvas и конвертируем в dataURL
            const canvas = qr.canvas;
            showImage('qr-image', canvas.toDataURL('image/png'));
        }

        function generateBarcode() {
            const text = document.getElementById('barcode-text').value.trim();
            if (!text) {
                alert('Введите текст для штрихкода');
                return;
            }
            JsBarcode(document.getElementById('barcode-image'), text, {
                format: "CODE128",
                displayValue: true,
                fontSize: 14,
                width: 2,
                height: 50
            });
            const barcodeCanvas = document.querySelector('#barcode-image + canvas');
            if (barcodeCanvas) {
                showImage('barcode-image', barcodeCanvas.toDataURL('image/png'));
            } else {
                // fallback: если библиотека рисует сразу в img (зависит от версии), используем src
                const img = document.getElementById('barcode-image');
                if (img.src) showImage('barcode-image', img.src);
            }
        }

        async function generateQRWithImage() {
            const text = document.getElementById('qr-with-img-text').value.trim();
            if (!text) {
                alert('Введите текст для QR-кода');
                return;
            }
            if (!loadedImage) {
                alert('Загрузите картинку для центра QR-кода');
                return;
            }

            // Создаём QR в canvas через QRCode.js
            const container = document.createElement('div');
            const qr = new QRCode(container, {
                text: text,
                width: 256,
                height: 256
            });
            const canvas = qr.canvas;

            // Рисуем картинку в центре
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = loadedImage;
            img.onload = () => {
                const size = 80; // размер картинки в центре
                const offset = (256 - size) / 2;
                ctx.drawImage(img, offset, offset, size, size);

                const resultCanvas = document.getElementById('qr-with-image');
                resultCanvas.src = canvas.toDataURL('image/png');
                resultCanvas.style.display = 'block';
            };
        }
    </script>
</body>
</html>
