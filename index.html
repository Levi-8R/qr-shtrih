<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор кодов</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --accent: #bb86fc;
      --border: #333;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .controls {
      background: var(--surface);
      padding: 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.6rem;
      background: #2c2c2c;
      color: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 0.4rem;
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #preview-area {
      margin-top: 2rem;
      text-align: center;
    }

    img.result-image {
      max-width: 100%;
      height: auto;
      display: none; /* скрываем, пока не сгенерирован */
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .status {
      margin-top: 0.75rem;
      min-height: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }

    /* Индикация загрузки */
    .loading::after {
      content: "Генерация...";
      display: inline-block;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор кодов</h1>

    <div class="controls">
      <label for="type-select">Тип кода:</label>
      <select id="type-select">
        <option value="qr">QR-код (обычный)</option>
        <option value="qr-image">QR-код с картинкой по центру</option>
        <option value="code128">Штрихкод Code 128</option>
      </select>

      <label for="input-text">Текст/ссылка:</label>
      <input type="text" id="input-text" placeholder="Введите текст или URL" value="https://example.com" />

      <label for="image-input">Картинка для центра QR (для QR с картинкой):</label>
      <input type="file" id="image-input" accept="image/*" />
      <div id="image-status" style="margin-top:0.3rem; font-size:0.85rem; color:#aaa;">Картинка не загружена</div>

      <button id="generate-btn">Сгенерировать</button>
      <button id="download-btn" disabled style="background:#444;">Скачать результат</button>
    </div>

    <div id="preview-area">
      <img id="result-img" class="result-image" alt="Результат" />
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Библиотеки -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <script>
    const typeSelect = document.getElementById('type-select');
    const inputText = document.getElementById('input-text');
    const imageInput = document.getElementById('image-input');
    const generateBtn = document.getElementById('generate-btn');
    const downloadBtn = document.getElementById('download-btn');
    const resultImg = document.getElementById('result-img');
    const statusEl = document.getElementById('status');
    const imageStatus = document.getElementById('image-status');

    let loadedImage = null;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) {
        loadedImage = null;
        imageStatus.textContent = 'Картинка не загружена';
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = event.target.result; // data URL
        const imgName = file.name;
        imageStatus.innerHTML = `Загружено: <strong>${imgName}</strong>`;
      };
      reader.readAsDataURL(file);
    });

    generateBtn.addEventListener('click', () => {
      const type = typeSelect.value;
      const text = inputText.value.trim();
      if (!text) {
        statusEl.textContent = 'Введите текст или ссылку';
        statusEl.style.color = '#ff6b6b';
        return;
      }

      statusEl.textContent = '';
      statusEl.className = 'status';
      resultImg.style.display = 'none';
      downloadBtn.disabled = true;

      if (type === 'code128') {
        generateCode128(text);
      } else if (type === 'qr') {
        generateQR(text, null);
      } else if (type === 'qr-image') {
        if (!loadedImage) {
          statusEl.textContent = 'Загрузите картинку для центра QR-кода';
          statusEl.style.color = '#ff6b6b';
          return;
        }
        generateQRWithImage(text, loadedImage);
      }
    });

    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = resultImg.src;
      a.download = `code-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    function setStatus(msg, color = null) {
      statusEl.textContent = msg;
      if (color) statusEl.style.color = color;
    }

    // Code128
    function generateCode128(data) {
      try {
        // JsBarcode рисует на canvas, мы его конвертируем в img
        const canvas = document.createElement('canvas');
        JsBarcode(canvas, data, {
          format: 'CODE128',
          displayValue: true,
          width: 2,
          height: 50,
          fontSize: 14,
          lineColor: '#ffffff',
          background: '#000000'
        });
        resultImg.src = canvas.toDataURL('image/png');
        resultImg.onload = () => {
          resultImg.style.display = 'block';
          downloadBtn.disabled = false;
          setStatus('Штрихкод Code128 готов');
        };
        resultImg.onerror = () => setStatus('Ошибка генерации штрихкода', '#ff6b6b');
      } catch (e) {
        setStatus('Ошибка при генерации штрихкода: ' + e.message, '#ff6b6b');
      }
    }

    // Обычный QR
    function generateQR(text, imageData) {
      try {
        const container = document.createElement('div');
        // QRCode.js не умеет сам в dataURL, поэтому рисуем в DOM, потом копируем в canvas
        new QRCode(container, {
          text: text,
          width: 256,
          height: 256
        });

        // Находим canvas внутри контейнера
        const qrCanvas = container.querySelector('canvas');
        if (!qrCanvas) throw new Error('Не удалось создать QR-код');

        if (imageData) {
          // Накладываем картинку по центру
          const ctx = qrCanvas.getContext('2d');
          const img = new Image();
          img.src = imageData;
          img.onload = () => {
            const size = 80; // размер картинки в центре
            const x = (qrCanvas.width - size) / 2;
            const y = (qrCanvas.height - size) / 2;
            ctx.drawImage(img, x, y, size, size);
            finishQR(qrCanvas);
          };
          img.onerror = () => {
            setStatus('Ошибка загрузки картинки для QR', '#ff6b6b');
          };
        } else {
          finishQR(qrCanvas);
        }
      } catch (e) {
        setStatus('Ошибка при генерации QR-кода: ' + e.message, '#ff6b6b');
      }
    }

    function generateQRWithImage(text, imageData) {
      generateQR(text, imageData);
    }

    function finishQR(canvas) {
      resultImg.src = canvas.toDataURL('image/png');
      resultImg.onload = () => {
        resultImg.style.display = 'block';
        downloadBtn.disabled = false;
        setStatus('QR-код готов');
      };
      resultImg.onerror = () => setStatus('Ошибка сохранения QR-кода', '#ff6b6b');
    }
  </script>
</body>
</html>
