<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор QR и штрихкодов</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 10px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-generate {
      background: #28a745;
      color: white;
    }
    .btn-generate:hover, .btn-generate.active {
      background: #218838;
    }

    .mode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .mode-buttons button {
      background: #e9ecef;
      color: #333;
      flex: 1 1 auto;
      min-width: 130px;
    }
    .mode-buttons button.active {
      background: #007bff;
      color: white;
    }

    #result {
      text-align: center;
      margin-top: 20px;
      position: relative;
    }

    /* Контейнер для QR с логотипом: QR внизу, логотип сверху */
    .qr-with-logo-wrapper {
      position: relative;
      display: inline-block;
      margin: 0 auto;
    }
    .qr-with-logo-img {
      display: block;
      max-width: 100%;
    }
    .overlay-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      object-fit: contain;
      pointer-events: none; /* чтобы не мешал кликам */
      z-index: 10;
      display: block;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
    }

    .upload-section {
      display: none;
      margin-bottom: 18px;
      text-align: left;
    }
    
    .upload-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-label {
      display: inline-block;
      padding: 10px 16px;
      background: #e9ecef;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    .upload-input {
      display: none;
    }

    .upload-status {
      margin-left: 12px;
      padding: 6px 12px;
      background: #d4edda;
      color: #155724;
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: nowrap;
      display: none;
    }

    .actions {
      margin-top: 15px;
      text-align: center;
    }
    .btn-download {
      background: #6c757d;
      color: white;
    }
    .btn-download:hover {
      background: #545c64;
    }

    @media (max-width: 480px) {
      .mode-buttons button {
        min-width: 100%;
      }
      .upload-wrapper {
        flex-direction: column;
        align-items: stretch;
      }
      .upload-status {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор QR и штрихкодов</h1>

    <div class="controls">
      <input type="text" id="inputText" placeholder="Введите текст или ссылку" value="https://example.com" />
      <button class="btn-generate" id="genBtn" onclick="generate()">Сгенерировать</button>
    </div>

    <div class="mode-buttons">
      <button id="btnMode1" class="active" onclick="setMode(1)">Обычный QR</button>
      <button id="btnMode2" onclick="setMode(2)">Штрихкод</button>
      <button id="btnMode3" onclick="setMode(3)">QR с картинкой</button>
    </div>

    <div id="uploadSection" class="upload-section">
      <div class="upload-wrapper">
        <label class="upload-label">
          Загрузить картинку для центра QR
          <input type="file" id="imageInput" class="upload-input" accept="image/*" />
        </label>
        <span id="uploadStatus" class="upload-status"></span>
      </div>
    </div>

    <div id="result"></div>

    <div class="actions">
      <button class="btn-download" onclick="downloadResult()">Скачать результат (PNG)</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    let currentMode = 1;
    let userImage = null;
    let lastResultCanvas = null; // канвас для скачивания

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-buttons button').forEach(b => b.classList.remove('active'));
      if (mode === 1) document.getElementById('btnMode1').classList.add('active');
      if (mode === 2) document.getElementById('btnMode2').classList.add('active');
      if (mode === 3) document.getElementById('btnMode3').classList.add('active');

      const uploadSection = document.getElementById('uploadSection');
      const status = document.getElementById('uploadStatus');
      
      if (mode === 3) {
        uploadSection.style.display = 'block';
      } else {
        uploadSection.style.display = 'none';
        userImage = null;
        status.style.display = 'none';
        status.textContent = '';
      }
      document.getElementById('result').innerHTML = '';
      lastResultCanvas = null;
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        userImage = event.target.result;
        const status = document.getElementById('uploadStatus');
        status.textContent = 'Загружено: ' + file.name;
        status.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function generate() {
      const btn = document.getElementById('genBtn');
      btn.classList.add('active');
      
      const text = document.getElementById('inputText').value.trim();
      if (!text) {
        alert('Введите текст или ссылку');
        btn.classList.remove('active');
        return;
      }

      document.getElementById('result').innerHTML = '';
      lastResultCanvas = null;

      try {
        if (currentMode === 1) {
          // Обычный QR
          const container = document.createElement('div');
          container.id = 'qr-container-1';
          document.getElementById('result').appendChild(container);
          new QRCode(container, {
            text: text,
            width: 256,
            height: 256
          });
          // Для скачивания: ждём, когда появится img, и делаем канвас
          waitForImgAndPrepareCanvas(container, false);
        } 
        else if (currentMode === 2) {
          // Штрихкод
          const canvas = document.createElement('canvas');
          canvas.width = 300;
          canvas.height = 120;
          document.getElementById('result').appendChild(canvas);

          JsBarcode(canvas, text, {
            format: "CODE128",
            displayValue: true,
            fontSize: 14,
            textAlign: "center",
            fontOptions: "bold"
          });

          lastResultCanvas = canvas;
          btn.classList.remove('active');
        } 
        else if (currentMode === 3) {
          // QR с логотипом (стабильно)
          createQrWithLogoStable(text);
        }
      } catch (e) {
        console.error(e);
        btn.classList.remove('active');
        alert('Ошибка при генерации кода');
      }
    }

    // Самый надёжный способ: создаём свой img с QR через QRCode.createImageTag,
    // кладём его, поверх него — логотип через CSS
    function createQrWithLogoStable(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'qr-with-logo-wrapper';

      // Создаём картинку QR вручную, чтобы точно контролировать момент появления
      const qrImg = document.createElement('img');
      qrImg.className = 'qr-with-logo-img';
      qrImg.width = 256;
      qrImg.height = 256;

      // QRCodeJS: createImageTag возвращает готовый img.src в dataURL
      const tag = QRCode.createImageTag(text, { width: 256, height: 256 });
      // tag — это строка <img src="data:...">, нам нужен только src
      const srcMatch = tag.match(/src=["']([^"']+)["']/);
      if (srcMatch && srcMatch[1]) {
        qrImg.src = srcMatch[1];
      } else {
        // fallback: если createImageTag вдруг не сработает, пробуем обычный QR
        const container = document.createElement('div');
        new QRCode(container, { text: text, width: 256, height: 256 });
        wrapper.appendChild(container);
      }

      wrapper.appendChild(qrImg);

      // Если есть логотип — добавляем его поверх
      if (userImage) {
        const logo = document.createElement('img');
        logo.src = userImage;
        logo.className = 'overlay-logo';
        wrapper.appendChild(logo);
      }

      document.getElementById('result').appendChild(wrapper);

      // Для скачивания готовим канвас с QR + логотипом
      prepareCanvasForDownload(qrImg, !!userImage);

      const btn = document.getElementById('genBtn');
      btn.classList.remove('active');
    }

    // Для обычного QR: ждём появления img и готовим канвас для скачивания (без логотипа)
    function waitForImgAndPrepareCanvas(container, hasLogo) {
      const check = setInterval(() => {
        const img = container.querySelector('img');
        if (img && img.naturalWidth > 0) {
          clearInterval(check);
          prepareCanvasForDownload(img, hasLogo);
          const btn = document.getElementById('genBtn');
          btn.classList.remove('active');
        }
      }, 100);
      setTimeout(() => clearInterval(check), 3000);
    }

    // Готовим канвас только для скачивания: туда рисуем QR, если нужно — сверху логотип
    function prepareCanvasForDownload(qrImg, hasLogo) {
      const c = document.createElement('canvas');
      c.width = qrImg.width || 256;
      c.height = qrImg.height || 256;
      const ctx = c.getContext('2d');
      ctx.drawImage(qrImg, 0, 0);

      if (hasLogo && userImage) {
        const overlay = new Image();
        overlay.onload = () => {
          const size = 80;
          const x = (c.width - size) / 2;
          const y = (c.height - size) / 2;
          ctx.drawImage(overlay, x, y, size, size);
          lastResultCanvas = c;
        };
        overlay.onerror = () => {
          lastResultCanvas = c; // даже если лого не загрузилось — сохраняем QR
        };
        overlay.src = userImage;
      } else {
        lastResultCanvas = c;
      }
    }

    function downloadResult() {
      if (!lastResultCanvas) {
        alert('Сначала сгенерируйте код');
        return;
      }
      const link = document.createElement('a');
      link.download = 'code.png';
      link.href = lastResultCanvas.toDataURL('image/png');
      link.click();
    }

    setMode(1);
  </script>
</body>
</html>
