<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор кодов</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --accent: #bb86fc;
      --border: #333;
      --disabled-bg: #444;
      --disabled-text: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .controls {
      background: var(--surface);
      padding: 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.6rem;
      background: #2c2c2c;
      color: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      margin-top: 0.4rem;
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    /* Активная кнопка */
    .btn-active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
    }
    .btn-active:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    /* Неактивная кнопка */
    .btn-disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #preview-area {
      margin-top: 2rem;
      text-align: center;
    }

    img.result-image {
      max-width: 100%;
      height: auto;
      display: none;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .status {
      margin-top: 0.75rem;
      min-height: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .image-status {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.3rem;
    }
    .image-status.loaded {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор кодов</h1>

    <div class="controls">
      <label for="type-select">Тип кода:</label>
      <select id="type-select">
        <option value="qr">QR-код</option>
        <option value="qr-image">QR-код с картинкой по центру</option>
        <option value="code128">Штрихкод</option>
      </select>

      <label for="input-text">Текст/ссылка:</label>
      <input type="text" id="input-text" placeholder="Введите текст или URL" value="https://example.com" />

      <label for="image-input">Картинка для центра QR (для QR с картинкой):</label>
      <input type="file" id="image-input" accept="image/*" />
      <div id="image-status" class="image-status">Картинка не загружена</div>

      <button id="generate-btn" class="btn-active">Сгенерировать</button>
      <button id="download-btn" class="btn-disabled">Скачать результат</button>
    </div>

    <div id="preview-area">
      <img id="result-img" class="result-image" alt="Результат" />
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Библиотеки -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <script>
    const typeSelect = document.getElementById('type-select');
    const inputText = document.getElementById('input-text');
    const imageInput = document.getElementById('image-input');
    const generateBtn = document.getElementById('generate-btn');
    const downloadBtn = document.getElementById('download-btn');
    const resultImg = document.getElementById('result-img');
    const statusEl = document.getElementById('status');
    const imageStatus = document.getElementById('image-status');

    let loadedImage = null;
    let hasResult = false; // флаг: есть ли сейчас валидный результат

    // Сброс состояния (когда тип кода меняется, текст меняется, картинка сбрасывается)
    function resetState() {
      hasResult = false;
      resultImg.style.display = 'none';
      statusEl.textContent = '';
      
      generateBtn.classList.remove('btn-disabled');
      generateBtn.classList.add('btn-active');

      downloadBtn.classList.remove('btn-active');
      downloadBtn.classList.add('btn-disabled');
    }

    typeSelect.addEventListener('change', resetState);
    inputText.addEventListener('input', resetState);

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) {
        loadedImage = null;
        imageStatus.textContent = 'Картинка не загружена';
        imageStatus.classList.remove('loaded');
        resetState();
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = event.target.result;
        const imgName = file.name;
        imageStatus.innerHTML = `Загружено: <strong>${imgName}</strong>`;
        imageStatus.classList.add('loaded');
        // Не сбрасываем результат сразу: если картинка новая, но результат был — он уже невалиден
        resetState();
      };
      reader.readAsDataURL(file);
    });

    generateBtn.addEventListener('click', () => {
      const type = typeSelect.value;
      const text = inputText.value.trim();
      if (!text) {
        statusEl.textContent = 'Введите текст или ссылку';
        statusEl.style.color = '#ff6b6b';
        return;
      }

      resetState(); // сначала сбрасываем, чтобы кнопки стали как «до генерации»

      if (type === 'code128') {
        generateCode128(text);
      } else if (type === 'qr') {
        generateQR(text, null);
      } else if (type === 'qr-image') {
        if (!loadedImage) {
          statusEl.textContent = 'Загрузите картинку для центра QR-кода';
          statusEl.style.color = '#ff6b6b';
          return;
        }
        generateQRWithImage(text, loadedImage);
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!hasResult || !resultImg.src) return;
      const a = document.createElement('a');
      a.href = resultImg.src;
      const now = Date.now();
      const type = typeSelect.value;
      let filename = '';
      if (type === 'code128') filename = `code128-${now}.png`;
      else if (type === 'qr-image') filename = `qr-with-image-${now}.png`;
      else filename = `qr-${now}.png`;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    function setStatus(msg, color = null) {
      statusEl.textContent = msg;
      if (color) statusEl.style.color = color;
      else statusEl.style.color = '';
    }

    function finishGeneration() {
      hasResult = true;
      // Кнопки: генерация — неактивна, скачать — активна
      generateBtn.classList.remove('btn-active');
      generateBtn.classList.add('btn-disabled');

      downloadBtn.classList.remove('btn-disabled');
      downloadBtn.classList.add('btn-active');
    }

    // Code128
    function generateCode128(data) {
      try {
        const canvas = document.createElement('canvas');
        JsBarcode(canvas, data, {
          format: 'CODE128',
          displayValue: true,
          width: 2,
          height: 50,
          fontSize: 14,
          lineColor: '#ffffff',
          background: '#000000'
        });
        resultImg.src = canvas.toDataURL('image/png');
        resultImg.onload = () => {
          resultImg.style.display = 'block';
          finishGeneration();
          setStatus('Штрихкод готов');
        };
        resultImg.onerror = () => setStatus('Ошибка генерации штрихкода', '#ff6b6b');
      } catch (e) {
        setStatus('Ошибка при генерации штрихкода: ' + e.message, '#ff6b6b');
      }
    }

    // Обычный QR
    function generateQR(text, imageData) {
      try {
        const container = document.createElement('div');
        new QRCode(container, {
          text: text,
          width: 256,
          height: 256
        });

        const qrCanvas = container.querySelector('canvas');
        if (!qrCanvas) throw new Error('Не удалось создать QR-код');

        if (imageData) {
          const ctx = qrCanvas.getContext('2d');
          const img = new Image();
          img.src = imageData;
          img.onload = () => {
            const size = 80;
            const x = (qrCanvas.width - size) / 2;
            const y = (qrCanvas.height - size) / 2;
            ctx.drawImage(img, x, y, size, size);
            finishQR(qrCanvas);
          };
          img.onerror = () => {
            setStatus('Ошибка загрузки картинки для QR', '#ff6b6b');
          };
        } else {
          finishQR(qrCanvas);
        }
      } catch (e) {
        setStatus('Ошибка при генерации QR-кода: ' + e.message, '#ff6b6b');
      }
    }

    function generateQRWithImage(text, imageData) {
      generateQR(text, imageData);
    }

    function finishQR(canvas) {
      resultImg.src = canvas.toDataURL('image/png');
      resultImg.onload = () => {
        resultImg.style.display = 'block';
        finishGeneration();
        setStatus('QR-код готов');
      };
      resultImg.onerror = () => setStatus('Ошибка сохранения QR-кода', '#ff6b6b');
    }
  </script>
</body>
</html>
